name: obd
channels:
  - conda-forge
dependencies:
  - python>=3.10
  - numpy=2.3.5          # numpy/numba/llvmlite/mpmath: OBD-core's constraints.txt (v0.6.0)
  - scipy
  - sympy
  - mpmath=1.4.0
  - numba=0.63.1
  - llvmlite=0.46.0
  - pyarrow
  - h5py
  - matplotlib
  - plotly
  - scikit-learn
  - umap-learn
  - pip
  - pip:
      - obd-core @ git+https://github.com/dperlman/OBD-core.git@v0.6.0
